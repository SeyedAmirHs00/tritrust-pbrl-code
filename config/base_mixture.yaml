# reward learning
segment: 50
activation: tanh
num_seed_steps: 1000
num_unsup_steps: 9000
num_interact: 5000
reward_lr: 0.0003
reward_batch: 25
reward_update: 200
feed_type: 1
reset_update: 100
topK: 5
ensemble_size: 3
max_feedback: 2000
large_batch: 10
label_margin: 0.0
teacher_betas: 
  - 1
  - 1
  - 1
  - -1
teacher_gamma: 1
teacher_eps_mistake: 0
teacher_eps_skip: 0
teacher_eps_equal: 0

# scheduling
reward_schedule: 0

# evaluation config
eval_frequency: 10000
num_eval_episodes: 10

# device
device: cuda

# logger
log_frequency: 10000
log_save_tb: false

# training 
num_train_steps: 1e6
replay_buffer_capacity: ${num_train_steps}

# environment
env: metaworld_button-press-v2

# seed
seed: 1

# video recorder
save_video: false

